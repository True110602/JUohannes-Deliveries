<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#0056b3"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background badge -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGradient)"/>

  <!-- Delivery box -->
  <g transform="translate(256, 240)">
    <!-- Box body -->
    <path d="M -100 -20 L 0 -70 L 100 -20 L 100 70 L 0 120 L -100 70 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Box top-left face (darker) -->
    <path d="M -100 -20 L 0 -70 L 0 30 L -100 70 Z" fill="#e8f1ff"/>
    <!-- Box top-right face -->
    <path d="M 100 -20 L 0 -70 L 0 30 L 100 70 Z" fill="#ffffff"/>
    <!-- Box tape / seam -->
    <line x1="0" y1="-70" x2="0" y2="120" stroke="#007bff" stroke-width="6" opacity="0.35"/>
    <path d="M -100 -20 L 0 30 L 100 -20" fill="none" stroke="#007bff" stroke-width="6" opacity="0.35"/>
  </g>

  <!-- Motion / speed lines (delivery movement) -->
  <g stroke="#28a745" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="70" y1="380" x2="150" y2="380"/>
    <line x1="70" y1="410" x2="190" y2="410"/>
    <line x1="70" y1="440" x2="130" y2="440"/>
  </g>
</svg>
