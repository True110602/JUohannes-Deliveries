<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (async function verifyAuth() {
    const token = localStorage.getItem('token');

    // 1. If no token in local storage, send back to login
    if (!token) {
      window.location.href = '/index.html'; // Change to your login page filename if different
      return;
    }

    try {
      // 2. Validate token against server endpoint
      const res = await fetch('/api/check-session', {
        method: 'GET',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        }
      });

      const data = await res.json();

      if (!res.ok || !data.loggedIn) {
        // Token expired or invalid -> Clear local storage & kick back
        localStorage.removeItem('token');
        window.location.href = '/index.html';
      }
    } catch (err) {
      console.error('Session validation error:', err);
      // Fallback: stay on page if backend server is temporarily unreachable
    }
  })();
</script>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Johannes Deliveries - Driver Portal</title>

  <script src="/js/config.js"></script>
  <script src="/js/ui-helpers.js"></script>
  <script src="/js/geo-helpers.js"></script>
  <script>
    // These are declared at the top level (not nested inside the .then()
    // below) so that the Logout button's onclick, the socket.io handler,
    // and the map script further down the page can all actually see them.
    function logoutDriver() {
      clearAuthToken();
      window.location.href = '/login.html';
    }

    function renderMyOrders(orders) {
      const myEmail = document.getElementById('driverId').value;
      const mine = orders.filter(function(o) {
        return o.assignedDriver === myEmail && o.status !== 'delivered' && o.status !== 'cancelled';
      });
      const container = document.getElementById('ordersList');
      if (!mine.length) {
        container.innerHTML = 'No orders assigned yet.';
        return;
      }
      let html = '';
      for (let i = 0; i < mine.length; i++) {
        const o = mine[i];
        let btn = '';
        if (o.status === 'assigned') {
          btn = '<button onclick="updateOrderStatus(\'' + o._id + '\',\'picked_up\')">Mark Picked Up</button>';
        } else if (o.status === 'picked_up') {
          btn = '<button onclick="updateOrderStatus(\'' + o._id + '\',\'delivered\')">Mark Delivered</button>';
        }
        html += '<div class="fx-card" style="margin-top:10px;">'
          + '<div><b>Order #' + o._id.slice(-6) + '</b></div>'
          + '<div>Pickup: ' + o.pickup + '</div>'
          + '<div>Dropoff: ' + o.dropoff + '</div>'
          + '<div>Customer: ' + o.customerName + '</div>'
          + '<div>Status: ' + o.status + '</div>'
          + btn
          + '</div>';
      }
      container.innerHTML = html;
    }

    async function loadMyOrders() {
      const res = await authFetch(`${window.API_BASE}/api/orders/mine`);
      renderMyOrders(await res.json());
    }

    async function updateOrderStatus(orderId, status) {
      await authFetch(`${window.API_BASE}/api/orders/${orderId}/status`, {
        method: 'PATCH',
        body: JSON.stringify({ status })
      });
      loadMyOrders();
    }

    authFetch(`${window.API_BASE}/api/check-session`)
      .then(res => res.json())
      .then(data => {
        if (!data.loggedIn) {
          window.location.href = '/login.html';
        } else {
          const driverInput = document.getElementById('driverId');
          if (driverInput) driverInput.value = data.user.email;
          loadMyOrders();
        }
      });
  </script>

  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>

  <div class="fx-shell" style="max-width: 640px;">
  <div class="fx-card">
    <div class="fx-nav" style="margin-bottom:14px;">
      <div class="fx-nav-title">
        <img src="/assets/icon.svg" alt="Johannes Deliveries" class="fx-logo-mark" style="width:32px;height:32px;">
        <div>
          <span class="fx-pill">Driver</span>
          <h2 style="margin:6px 0 0;">Navigation portal</h2>
        </div>
      </div>
      <button class="fx-btn-danger" style="width:auto;" onclick="logoutDriver()">Logout</button>
    </div>

    <div class="status-box" id="connectionStatus">Status: Offline</div>

    <label>Driver ID / Name</label>
    <input type="text" id="driverId" readonly>

    <button id="trackBtn" onclick="startTracking(this)" style="margin-top:16px;">Go Online & Track GPS</button>

    <label>Active Delivery</label>
<div id="ordersList" style="margin-bottom:16px;">No orders assigned yet.</div>

    <label>Live GPS Position</label>
    <div id="map" style="width:100%; height:350px; margin-top:10px;"></div>
  </div>
  </div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script>
    const socket = io(window.API_BASE || undefined, {
      auth: { token: getAuthToken() }
    });
    socket.on('update_orders', renderMyOrders);
    const map = L.map('map').setView([-20.1350, 28.5800], 15);
    let marker = null;

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let hasFirstFix = false;

    function startTracking(button) {
      const driverId = document.getElementById('driverId').value;
      if (!driverId) {
        alert("Session not loaded yet. Please wait a second.");
        return;
      }

      setButtonLoading(button, true, 'Requesting location permission...');
      const statusBox = document.getElementById('connectionStatus');
      statusBox.innerText = "Status: Connecting...";
      statusBox.style.background = "";
      statusBox.style.color = "";

      watchLocation(
        (lat, lng) => {
          if (!hasFirstFix) {
            hasFirstFix = true;
            setButtonLoading(button, false);
            statusBox.innerText = "Status: Online & Broadcasting Live";
            statusBox.style.background = "rgba(74,222,128,0.12)";
            statusBox.style.color = "#4ade80";
            button.innerHTML = 'Live Tracking Active';
            button.disabled = true;
          }

          map.setView([lat, lng], 16);

          if (marker) {
            marker.setLatLng([lat, lng]);
          } else {
            marker = L.marker([lat, lng]).addTo(map)
              .bindPopup(`<b>${driverId}</b> (You)`)
              .openPopup();
          }

          socket.emit('driver_connect', { driverId, lat, lng });
        },
        (err) => {
          setButtonLoading(button, false);
          statusBox.innerText = "Status: Offline";
          statusBox.style.background = "";
          statusBox.style.color = "";
          alert("Error tracking location: " + err.message);
        }
      );
    }
  </script>

</body>
</html>
