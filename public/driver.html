<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Johannes Deliveries - Driver Portal</title>
  
  <script src="/js/config.js"></script>
  <script src="/js/ui-helpers.js"></script>
  <script src="/js/geo-helpers.js"></script>
  <script>
    authFetch(`${window.API_BASE}/api/check-session`)
      .then(res => res.json())
      .then(data => {
        if (!data.loggedIn) {
          window.location.href = '/login.html';
        } else {
          const driverInput = document.getElementById('driverId');
          if (driverInput) driverInput.value = data.user.email;
        }
      });

    function logoutDriver() {
      clearAuthToken();
      window.location.href = '/login.html';
    }
  </script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
    .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 4px rgba(0,0,0,0.1); margin: auto; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; margin-bottom: 15px; box-sizing: border-box; }
    button { background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    #map { width: 100%; height: 350px; border-radius: 8px; margin-top: 10px; }
    .status-box { padding: 10px; background: #e9ecef; border-radius: 4px; margin-bottom: 15px; text-align: center; font-weight: bold; }
    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .logout-btn { background: #dc3545; width: auto; padding: 6px 12px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-bar">
      <h2>Driver Navigation Portal</h2>
      <button class="logout-btn" onclick="logoutDriver()">Logout</button>
    </div>
    
    <div class="status-box" id="connectionStatus">Status: Offline</div>

    <label>Driver ID / Name:</label>
    <input type="text" id="driverId" readonly style="background: #e9ecef; cursor: not-allowed;">

    <button id="trackBtn" onclick="startTracking(this)">Go Online & Track GPS</button>

    <label>Live GPS Position:</label>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const socket = io(window.API_BASE || undefined, {
      auth: { token: getAuthToken() }
    });
    const map = L.map('map').setView([-20.1350, 28.5800], 15);
    let marker = null;

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let hasFirstFix = false;

    function startTracking(button) {
      const driverId = document.getElementById('driverId').value;
      if (!driverId) {
        alert("Session not loaded yet. Please wait a second.");
        return;
      }

      setButtonLoading(button, true, 'Requesting location permission...');
      document.getElementById('connectionStatus').innerText = "Status: Connecting...";
      document.getElementById('connectionStatus').style.background = "#e9ecef";
      document.getElementById('connectionStatus').style.color = "#333";

      watchLocation(
        (lat, lng) => {
          if (!hasFirstFix) {
            hasFirstFix = true;
            setButtonLoading(button, false);
            document.getElementById('connectionStatus').innerText = "Status: Online & Broadcasting Live";
            document.getElementById('connectionStatus').style.background = "#d4edda";
            document.getElementById('connectionStatus').style.color = "#155724";
            button.innerHTML = 'Live Tracking Active';
            button.disabled = true;
          }

          map.setView([lat, lng], 16);

          if (marker) {
            marker.setLatLng([lat, lng]);
          } else {
            marker = L.marker([lat, lng]).addTo(map)
              .bindPopup(`<b>${driverId}</b> (You)`)
              .openPopup();
          }

          socket.emit('driver_connect', { driverId, lat, lng });
        },
        (err) => {
          setButtonLoading(button, false);
          document.getElementById('connectionStatus').innerText = "Status: Offline";
          document.getElementById('connectionStatus').style.background = "#e9ecef";
          document.getElementById('connectionStatus').style.color = "#333";
          alert("Error tracking location: " + err.message);
        }
      );
    }
  </script>

</body>
</html>
