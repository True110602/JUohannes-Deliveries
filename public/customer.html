<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  (async function verifyAuth() {
    const token = localStorage.getItem('token');

    // 1. If no token in local storage, send back to login
    if (!token) {
      window.location.href = '/index.html'; // Change to your login page filename if different
      return;
    }

    try {
      // 2. Validate token against server endpoint
      const res = await fetch('/api/check-session', {
        method: 'GET',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        }
      });

      const data = await res.json();

      if (!res.ok || !data.loggedIn) {
        // Token expired or invalid -> Clear local storage & kick back
        localStorage.removeItem('token');
        window.location.href = '/index.html';
      }
    } catch (err) {
      console.error('Session validation error:', err);
      // Fallback: stay on page if backend server is temporarily unreachable
    }
  })();
</script>
  <script src="/js/config.js"></script>
  <script src="/js/ui-helpers.js"></script>
  <script src="/js/geo-helpers.js"></script>
  <script>
    authFetch(`${window.API_BASE}/api/check-session`)
      .then(res => res.json())
      .then(data => {
        if (!data.loggedIn) {
          window.location.href = '/login.html';
        }
      });

    function logoutCustomer() {
      clearAuthToken();
      window.location.href = '/login.html';
    }
  </script>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Johannes Deliveries - Customer Portal</title>

<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/css/theme.css" />

  <style>
    #ecocashField { display: none; }
  </style>
</head>
<body>

  <div class="fx-shell" style="max-width: 700px;">
  <div class="fx-nav">
    <div class="fx-nav-title">
      <img src="/assets/icon.svg" alt="Johannes Deliveries" class="fx-logo-mark" style="width:32px;height:32px;">
      <span class="fx-pill">Customer</span>
    </div>
    <button class="fx-btn-ghost" style="width:auto;" onclick="showOrderHistory()">My Orders</button>
    <button class="fx-btn-ghost" style="width:auto;" onclick="logoutCustomer()">Logout</button>
  </div>

  <div class="fx-card" id="orderHistoryPanel" style="display:none;">
    <div class="fx-eyebrow">Order history</div>
    <h2 style="margin-top:0;">My Orders</h2>
    <button type="button" class="fx-btn-muted" style="width:auto; margin-bottom:12px;" onclick="hideOrderHistory()">&larr; Back to new order</button>
    <div id="orderHistoryList"><span class="inline-spinner fx-spinner-light"></span>Loading your orders...</div>
  </div>

  <div class="fx-card" id="newOrderPanel">
    <div class="fx-eyebrow">New request</div>
    <h2 style="margin-top:0;">Book a delivery / order</h2>

    <form id="orderForm">
      <label>Customer Name</label>
      <input type="text" name="customerName" required placeholder="e.g. Bhekinkosi Sibanda">

      <label>Pickup Location</label>
      <input type="text" name="pickup" required placeholder="e.g. Ascot Shopping Centre">

      <label>Drop-off Coordinates (Click map below)</label>
      <input type="text" name="dropoff" required placeholder="Coordinates will appear here">
      <input type="hidden" name="amount" id="amount" value="0">

      <label>Select Drop-off on Map</label>
      <button type="button" id="useMyLocationBtn" class="fx-btn-muted" style="margin-bottom: 8px;">Use My Location</button>
      <div id="map" style="width:100%; height:300px; margin-top:10px; margin-bottom:15px;"></div>

      <h3>Shops</h3>
      <div id="shopSelectionView">
        <div id="shopGrid" class="shop-grid"><span class="inline-spinner fx-spinner-light"></span>Loading shops...</div>
      </div>

      <div id="shopMenuView" style="display:none;">
        <button type="button" id="backToShopsBtn" class="fx-btn-muted" style="width:auto; margin-bottom:12px;">&larr; All shops</button>
        <h4 id="currentShopName" style="margin:0 0 10px;"></h4>
        <div id="customerCatalogList"><span class="inline-spinner fx-spinner-light"></span>Loading menu...</div>
      </div>

      <div id="orderSummary" style="display:none;">
        <b>Your order:</b>
        <ul id="orderSummaryList"></ul>
      </div>
      <input type="hidden" name="item" id="itemField">

      <label>Add a tip for your driver (optional)</label>
      <input type="number" name="tip" id="tipInput" step="0.01" min="0" value="0" placeholder="0.00">
      <div style="display:flex; gap:8px; margin:-8px 0 14px;">
        <button type="button" class="fx-btn-muted tip-quick-btn" style="width:auto; padding:6px 12px; font-size:13px;" data-tip="0">No tip</button>
        <button type="button" class="fx-btn-muted tip-quick-btn" style="width:auto; padding:6px 12px; font-size:13px;" data-tip="1">$1</button>
        <button type="button" class="fx-btn-muted tip-quick-btn" style="width:auto; padding:6px 12px; font-size:13px;" data-tip="2">$2</button>
        <button type="button" class="fx-btn-muted tip-quick-btn" style="width:auto; padding:6px 12px; font-size:13px;" data-tip="5">$5</button>
      </div>

      <div id="orderTotals" class="fx-card" style="padding:14px; margin-bottom:15px;">
        <div style="display:flex; justify-content:space-between; font-size:14px;"><span>Subtotal</span><span id="totalSubtotal">$0.00</span></div>
        <div style="display:flex; justify-content:space-between; font-size:14px; margin-top:4px;"><span>Tip</span><span id="totalTip">$0.00</span></div>
        <div style="display:flex; justify-content:space-between; font-size:16px; font-weight:700; margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.1);"><span>Total</span><span id="totalGrand">$0.00</span></div>
      </div>

      <label>Payment Method</label>
      <select name="paymentMethod" id="paymentMethod" required>
        <option value="Cash">Cash on Delivery</option>
        <option value="EcoCash">EcoCash</option>
        <option value="Card">Credit/Debit Card</option>
      </select>

      <div id="ecocashField">
        <label>EcoCash Number</label>
        <input type="tel" name="ecocashNumber" id="ecocashNumber" placeholder="e.g. 0771234567">
      </div>

      <button type="submit" style="margin-top: 20px;">Request Delivery & Pay</button>
    </form>
    <div id="paymentStatusBox" class="fx-alert fx-alert-warn" style="display:none; margin-top: 15px;"></div>
  </div>
  </div>

  <script src="/vendor/leaflet/leaflet.js"></script>

  <script>
    const map = L.map('map').setView([-20.1350, 28.5800], 15);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let currentMarker = null;

    map.on('click', function(e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      if (currentMarker) {
        map.removeLayer(currentMarker);
      }

      currentMarker = L.marker([lat, lng]).addTo(map)
        .bindPopup(`<b>Selected Drop-off</b><br>Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`)
        .openPopup();

      const dropoffInput = document.querySelector('input[name="dropoff"]');
      if (dropoffInput) {
        dropoffInput.value = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      }
    });

    document.getElementById('useMyLocationBtn').addEventListener('click', async (e) => {
      const btn = e.target;
      setButtonLoading(btn, true, 'Locating...');
      try {
        const { lat, lng } = await getCurrentLocation();
        map.setView([lat, lng], 16);
      } catch (err) {
        alert(err.message);
      } finally {
        setButtonLoading(btn, false);
      }
    });

    const paymentSelect = document.getElementById('paymentMethod');
    const ecocashField = document.getElementById('ecocashField');
    const ecocashInput = document.getElementById('ecocashNumber');

    paymentSelect.addEventListener('change', () => {
      const isEcoCash = paymentSelect.value === 'EcoCash';
      ecocashField.style.display = isEcoCash ? 'block' : 'none';
      ecocashInput.required = isEcoCash;
    });

    let orderItems = [];

    function renderOrderSummary() {
      const box = document.getElementById('orderSummary');
      const list = document.getElementById('orderSummaryList');
      const itemField = document.getElementById('itemField');

      if (orderItems.length === 0) {
        box.style.display = 'none';
        itemField.value = '';
        updateOrderTotals();
        return;
      }

      box.style.display = 'block';
      list.innerHTML = '';

      const summaryStrings = orderItems.map(entry => {
        const selectionsText = Object.entries(entry.selections)
          .map(([group, choice]) => `${group}: ${choice}`)
          .join(', ');
        const full = selectionsText ? `${entry.name} (${selectionsText})` : entry.name;

        const li = document.createElement('li');
        li.textContent = full;
        list.appendChild(li);

        return full;
      });

      itemField.value = summaryStrings.join('; ');
      updateOrderTotals();
    }

    // Computes subtotal from the selected items' actual prices, adds the
    // tip on top, and fills the hidden "amount" field automatically - the
    // customer no longer has to work out and type a total themselves.
    function updateOrderTotals() {
      const subtotal = orderItems.reduce((sum, entry) => sum + (parseFloat(entry.price) || 0), 0);
      const tip = parseFloat(document.getElementById('tipInput').value) || 0;
      const total = subtotal + tip;

      document.getElementById('totalSubtotal').innerText = `$${subtotal.toFixed(2)}`;
      document.getElementById('totalTip').innerText = `$${tip.toFixed(2)}`;
      document.getElementById('totalGrand').innerText = `$${total.toFixed(2)}`;
      // amount holds the subtotal only (not subtotal+tip) - tip is sent
      // separately so the server can keep the platform's commission based
      // only on the item subtotal, never taking a cut of the driver's tip.
      document.getElementById('amount').value = subtotal.toFixed(2);
    }

    document.getElementById('tipInput').addEventListener('input', updateOrderTotals);
    document.querySelectorAll('.tip-quick-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('tipInput').value = btn.dataset.tip;
        updateOrderTotals();
      });
    });

    function addToOrder(item) {
      const selections = {};
      (item.optionGroups || []).forEach(group => {
        const select = document.getElementById(`option-${item._id}-${group.groupName}`);
        if (select) selections[group.groupName] = select.value;
      });

      orderItems.push({
        name: item.name,
        selections,
        catalogItemId: item._id,
        merchantEmail: item.merchantEmail,
        price: item.price
      });
      renderOrderSummary();
    }

    // Turns the running orderItems list into the structured lineItems
    // shape the server stores - this is what lets a customer's order
    // history and a merchant's own order view actually work, instead of
    // only ever having the free-text summary below.
    function buildLineItemsPayload() {
      return orderItems.map(entry => ({
        catalogItemId: entry.catalogItemId,
        merchantEmail: entry.merchantEmail,
        name: entry.name,
        price: entry.price,
        quantity: 1,
        selectedOptions: entry.selections
      }));
    }

    // ---- Shop picker ----
    // Customers previously landed on one combined list of every merchant's
    // items with no way to tell which shop each came from. Now they pick a
    // shop first, then see just that shop's menu.
    async function loadShops() {
      const grid = document.getElementById('shopGrid');
      try {
        const res = await authFetch(`${window.API_BASE}/api/catalog/shops`);
        const shops = await res.json();
        grid.innerHTML = '';

        if (!shops.length) {
          grid.innerHTML = '<i class="fx-muted">No shops available right now.</i>';
          return;
        }

        shops.forEach(shop => {
          const card = document.createElement('div');
          card.className = 'shop-card';
          card.innerHTML = `
            ${shop.profilePicUrl ? `<img src="${shop.profilePicUrl}" alt="${shop.shopName}" onerror="this.style.display='none'">` : ''}
            <div class="shop-card-name">${shop.shopName}</div>
            <div class="shop-card-count">${shop.itemCount} item${shop.itemCount === 1 ? '' : 's'}</div>
          `;
          card.addEventListener('click', () => selectShop(shop.merchantEmail, shop.shopName));
          grid.appendChild(card);
        });
      } catch (err) {
        grid.innerHTML = '<i class="fx-muted">Could not load shops.</i>';
      }
    }

    function selectShop(merchantEmail, shopName) {
      document.getElementById('shopSelectionView').style.display = 'none';
      document.getElementById('shopMenuView').style.display = 'block';
      document.getElementById('currentShopName').innerText = shopName;
      loadCustomerCatalog(merchantEmail);
    }

    document.getElementById('backToShopsBtn').addEventListener('click', () => {
      document.getElementById('shopMenuView').style.display = 'none';
      document.getElementById('shopSelectionView').style.display = 'block';
    });

    async function loadCustomerCatalog(merchantEmail) {
      try {
        const res = await authFetch(`${window.API_BASE}/api/catalog?merchant=${encodeURIComponent(merchantEmail)}`);
        const items = await res.json();
        const container = document.getElementById('customerCatalogList');
        container.innerHTML = '';

        if (items.length === 0) {
          container.innerHTML = '<i>No items available right now.</i>';
          return;
        }

        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'catalog-item';

          const optionsHtml = (item.optionGroups || []).map(group => `
            <label>${group.groupName}:</label>
            <select id="option-${item._id}-${group.groupName}">
              ${group.choices.map(c => `<option value="${c}">${c}</option>`).join('')}
            </select>
          `).join('');

          div.innerHTML = `
            <div class="catalog-item-top">
              <div style="display:flex; align-items:center; gap:10px;">
                ${item.imageUrl ? `<img class="catalog-thumb" src="${item.imageUrl}" onerror="this.style.display='none'">` : ''}
                <div>
                  <span><b>${item.name}</b> - $${item.price.toFixed(2)}</span>
                  ${item.description ? `<div class="catalog-desc">${item.description}</div>` : ''}
                </div>
              </div>
              <span style="color: ${item.inStock ? 'var(--accent-ok)' : 'var(--accent-danger)'}; font-weight: bold; font-size:12px;">${item.inStock ? 'In Stock' : 'SOLD OUT'}</span>
            </div>
            ${item.inStock ? `
              <div class="catalog-options">${optionsHtml}</div>
              <button type="button" class="add-to-order-btn" data-item-id="${item._id}">Add to Order</button>
            ` : ''}
          `;

          if (item.inStock) {
            div.querySelector('.add-to-order-btn').addEventListener('click', () => addToOrder(item));
          }

          container.appendChild(div);
        });
      } catch (err) {
        document.getElementById('customerCatalogList').innerHTML = '<i>Could not load menu.</i>';
      }
    }

    loadShops();

    // --- Order history ---
    function showOrderHistory() {
      document.getElementById('newOrderPanel').style.display = 'none';
      document.getElementById('orderHistoryPanel').style.display = 'block';
      loadOrderHistory();
    }

    function hideOrderHistory() {
      document.getElementById('orderHistoryPanel').style.display = 'none';
      document.getElementById('newOrderPanel').style.display = 'block';
    }

    async function loadOrderHistory() {
      const list = document.getElementById('orderHistoryList');
      list.innerHTML = '<span class="inline-spinner fx-spinner-light"></span>Loading your orders...';
      try {
        const res = await authFetch(`${window.API_BASE}/api/orders/my-history`);
        const orders = await res.json();

        if (!Array.isArray(orders) || orders.length === 0) {
          list.innerHTML = '<i class="fx-muted">You haven\'t placed any orders yet.</i>';
          return;
        }

        list.innerHTML = '';
        orders.forEach(order => {
          const div = document.createElement('div');
          div.className = 'catalog-item';
          const when = new Date(order.createdAt).toLocaleString();
          const itemsText = (order.lineItems && order.lineItems.length > 0)
            ? order.lineItems.map(li => li.name).join(', ')
            : (order.item || 'N/A');

          div.innerHTML = `
            <div class="catalog-item-top">
              <div>
                <b>${itemsText}</b>
                <div class="catalog-desc">${when} &middot; $${(order.amount || 0).toFixed(2)} &middot; ${order.paymentMethod}</div>
              </div>
              <span class="fx-pill">${(order.status || 'pending').replace('_', ' ')}</span>
            </div>
          `;
          list.appendChild(div);
        });
      } catch (err) {
        list.innerHTML = '<i class="fx-muted">Could not load your order history.</i>';
      }
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (orderItems.length === 0) {
        alert('Please add at least one item from the menu before requesting delivery.');
        return;
      }

      const formData = new FormData(e.target);
      const payload = {
        customerName: formData.get('customerName'),
        pickup: formData.get('pickup'),
        dropoff: formData.get('dropoff'),
        item: formData.get('item'),
        lineItems: buildLineItemsPayload(),
        amount: formData.get('amount'),
        tip: formData.get('tip') || 0,
        paymentMethod: formData.get('paymentMethod'),
        ecocashNumber: formData.get('ecocashNumber') || null
      };

      const statusBox = document.getElementById('paymentStatusBox');
      const submitBtn = e.target.querySelector('button[type="submit"]');
      setButtonLoading(submitBtn, true, 'Submitting...');

      try {
        const res = await authFetch(`${window.API_BASE}/api/orders`, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        setButtonLoading(submitBtn, false);

        if (data.success) {
          const order = data.order;

          if (payload.paymentMethod === 'EcoCash') {
            if (order.paymentStatus === 'not_configured') {
              statusBox.style.display = 'block';
              statusBox.className = 'fx-alert fx-alert-danger';
              statusBox.innerText = 'Order recorded, but EcoCash payment processing is not set up yet - no payment request was sent.';
            } else if (order.paymentStatus === 'failed') {
              statusBox.style.display = 'block';
              statusBox.className = 'fx-alert fx-alert-danger';
              statusBox.innerText = `Payment request failed: ${order.paynowInstructions || 'Please try again.'}`;
            } else {
              statusBox.style.display = 'block';
              statusBox.className = 'fx-alert fx-alert-warn';
              statusBox.innerText = order.paynowInstructions
                ? `Check your phone: ${order.paynowInstructions}`
                : `A payment request was sent to ${payload.ecocashNumber}. Please confirm on your phone.`;

              let attempts = 0;
              const poll = setInterval(async () => {
                attempts++;
                try {
                  const statusRes = await authFetch(`${window.API_BASE}/api/orders/${order._id}/payment-status`);
                  const statusData = await statusRes.json();
                  if (statusData.paymentStatus === 'paid') {
                    statusBox.className = 'fx-alert fx-alert-ok';
                    statusBox.innerText = 'Payment confirmed! Your delivery is on its way.';
                    clearInterval(poll);
                  } else if (statusData.paymentStatus === 'failed' || statusData.paymentStatus === 'cancelled') {
                    statusBox.className = 'fx-alert fx-alert-danger';
                    statusBox.innerText = 'Payment was not completed.';
                    clearInterval(poll);
                  }
                } catch (err) {}
                if (attempts >= 24) clearInterval(poll);
              }, 5000);
            }
          } else {
            statusBox.style.display = 'block';
            statusBox.className = 'fx-alert fx-alert-ok';
            statusBox.innerText = 'Delivery requested! We\'ll be in touch shortly.';
          }

          e.target.reset();
          ecocashField.style.display = 'none';
          orderItems = [];
          renderOrderSummary();
        } else {
          alert(data.message || 'Could not submit your order.');
        }
      } catch (err) {
        setButtonLoading(submitBtn, false);
        alert('Server connection error.');
      }
    });
  </script>

</body>
</html>
