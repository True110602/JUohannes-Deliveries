<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - JUohannes Deliveries</title>
  <link rel="stylesheet" href="/css/menu.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

<main class="main-content">
  <h1 class="page-title">Reports 📈</h1>
  <p class="page-sub">How your shop is doing — sales, best sellers and customer reviews.</p>
  <div class="stat-grid" id="stats"></div>
  <div class="card"><h2>Sales — last 7 days</h2><div id="chart"></div></div>
  <div class="card"><h2>🏆 Best sellers</h2><div id="top"></div></div>
  <div class="card" id="reviews"><h2>⭐ Customer reviews</h2><div id="revList"></div></div>
</main>

<script src="/js/config.js"></script>
<script src="/js/menu.js"></script>
<script src="/js/page.js"></script>
<script>

document.addEventListener('DOMContentLoaded', async () => {
  const me = JD.guard('merchant');
  if (!me) return;
  try {
    const [orders, stats] = await Promise.all([
      JD.api('/api/merchant/orders'),
      JD.api('/api/merchant/stats').catch(() => ({}))
    ]);
    const mine = (o) => (o.lineItems || []).filter(l => l.merchantEmail === me.email);
    const share = (o) => mine(o).reduce((s, l) => s + l.price * l.quantity, 0);
    const delivered = orders.filter(o => o.status === 'delivered');
    const sales = delivered.reduce((s, o) => s + share(o), 0);
    const pending = orders.filter(o => ['pending', 'assigned', 'picked_up'].includes(o.status)).length;
    const rated = orders.filter(o => o.shopRating);
    const avg = rated.length ? (rated.reduce((s, o) => s + o.shopRating, 0) / rated.length).toFixed(1) : '—';

    document.getElementById('stats').innerHTML =
      JD.statCard('Sales (delivered)', JD.money(sales), delivered.length + ' orders') +
      JD.statCard('Your take-home', JD.money(stats.totalRevenue), 'After commission') +
      JD.statCard('In progress', pending, 'Waiting or on the road') +
      JD.statCard('Average rating', avg + (rated.length ? ' ⭐' : ''), rated.length + ' review' + (rated.length === 1 ? '' : 's'));

    const days = JD.lastDays(7);
    const byDay = Object.fromEntries(days.map(d => [d.key, 0]));
    delivered.forEach(o => { const k = new Date(o.createdAt).toDateString(); if (k in byDay) byDay[k] += share(o); });
    document.getElementById('chart').innerHTML = JD.bars(days.map(d => ({ label: d.label, value: byDay[d.key], text: byDay[d.key] ? '$' + byDay[d.key].toFixed(0) : '' })));

    const tally = {};
    delivered.forEach(o => mine(o).forEach(l => { const t = tally[l.name] || (tally[l.name] = { qty: 0, rev: 0 }); t.qty += l.quantity; t.rev += l.price * l.quantity; }));
    const top = Object.entries(tally).sort((a, b) => b[1].qty - a[1].qty).slice(0, 8);
    document.getElementById('top').innerHTML = top.length
      ? JD.table([{ h: 'Product', f: r => JD.esc(r[0]) }, { h: 'Sold', f: r => r[1].qty }, { h: 'Revenue', f: r => JD.money(r[1].rev) }], top)
      : JD.empty('🏆', 'Best sellers appear once you have delivered orders.');

    const withComments = rated.filter(o => o.ratingComment || o.shopRating);
    document.getElementById('revList').innerHTML = withComments.length
      ? withComments.slice(0, 20).map(o => `<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${'⭐'.repeat(o.shopRating)}</b> <span class="tile-meta">${JD.esc(o.customerName || 'Customer')} · ${JD.date(o.createdAt)}</span>${o.ratingComment ? `<div>“${JD.esc(o.ratingComment)}”</div>` : ''}</div>`).join('')
      : JD.empty('⭐', 'No reviews yet.');
  } catch (e) { JD.fail(e, document.getElementById('stats')); }
});

</script>
</body>
</html>
