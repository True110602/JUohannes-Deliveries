<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Mr L</title>
  <link rel="stylesheet" href="/css/menu.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

<main class="main-content">
  <h1 class="page-title">Reports 📊</h1>
  <p class="page-sub">Sales, best sellers and customer reviews for your shop.</p>

  <div class="stat-grid" id="stats"></div>

  <div class="card"><h2>Sales — last 7 days</h2><div id="chart"><div class="empty">Loading…</div></div></div>
  <div class="card"><h2>Best sellers</h2><div id="top"><div class="empty">Loading…</div></div></div>
  <div class="card" id="reviews"><h2>Customer reviews</h2><div id="reviewList"><div class="empty">Loading…</div></div></div>
</main>

<script src="/js/config.js"></script>
<script src="/js/menu.js"></script>
<script src="/js/page.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const me = JD.guard('merchant');
  if (!me) return;

  // Only the lines that belong to this shop (an order can include several shops).
  const mine = (o) => (o.lineItems || []).filter(l => l.merchantEmail === me.email);
  const share = (o) => mine(o).reduce((s, l) => s + (Number(l.price) || 0) * (Number(l.quantity) || 0), 0);
  const startOf = (daysAgo) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - daysAgo); return d; };

  const [ordersRes, statsRes, ratingsRes] = await Promise.allSettled([
    JD.api('/api/merchant/orders'),
    JD.api('/api/merchant/stats'),
    JD.api('/api/orders/ratings/shop/' + encodeURIComponent(me.email))
  ]);

  // ---- Sales (delivered orders only) ----
  if (ordersRes.status === 'fulfilled') {
    const delivered = ordersRes.value
      .filter(o => o.status === 'delivered')
      .map(o => ({ o, when: new Date(o.deliveryPhotoAt || o.updatedAt || o.createdAt), total: share(o) }));
    const sum = (rows) => rows.reduce((s, r) => s + r.total, 0);
    const today = delivered.filter(r => r.when >= startOf(0));
    const week = delivered.filter(r => r.when >= startOf(6));
    const month = delivered.filter(r => r.when >= startOf(29));

    const take = statsRes.status === 'fulfilled' && statsRes.value && statsRes.value.success ? statsRes.value : null;
    const rating = ratingsRes.status === 'fulfilled' && ratingsRes.value ? ratingsRes.value : null;

    document.getElementById('stats').innerHTML =
      JD.statCard('Today', JD.money(sum(today)), today.length + ' orders') +
      JD.statCard('Last 7 days', JD.money(sum(week)), week.length + ' orders') +
      JD.statCard('Last 30 days', JD.money(sum(month)), month.length + ' orders') +
      JD.statCard('All time sales', JD.money(sum(delivered)), delivered.length + ' delivered') +
      (take ? JD.statCard('Your take-home', JD.money(take.totalRevenue), 'After platform commission') : '') +
      JD.statCard('Rating', rating && rating.average ? rating.average.toFixed(1) + ' ⭐' : '—', rating ? rating.count + ' ratings' : 'No ratings yet');

    const days = JD.lastDays(7);
    const byDay = Object.fromEntries(days.map(d => [d.key, 0]));
    delivered.forEach(r => { const k = r.when.toDateString(); if (k in byDay) byDay[k] += r.total; });
    document.getElementById('chart').innerHTML = JD.bars(days.map(d => ({
      label: d.label, value: byDay[d.key], text: byDay[d.key] ? '$' + byDay[d.key].toFixed(0) : ''
    })));

    const items = {};
    delivered.forEach(r => mine(r.o).forEach(l => {
      const k = l.name || 'Item';
      items[k] = items[k] || { name: k, qty: 0, sales: 0 };
      items[k].qty += Number(l.quantity) || 0;
      items[k].sales += (Number(l.price) || 0) * (Number(l.quantity) || 0);
    }));
    const top = Object.values(items).sort((a, b) => b.qty - a.qty).slice(0, 10);
    document.getElementById('top').innerHTML = top.length
      ? JD.table([
          { h: 'Item', f: i => JD.esc(i.name) },
          { h: 'Sold', f: i => i.qty },
          { h: 'Sales', f: i => JD.money(i.sales) }
        ], top)
      : JD.empty('🍽️', 'No delivered orders yet.');
  } else {
    JD.fail(ordersRes.reason, document.getElementById('chart'));
    document.getElementById('top').innerHTML = '';
    document.getElementById('stats').innerHTML = '';
  }

  // ---- Reviews ----
  const reviewEl = document.getElementById('reviewList');
  if (ratingsRes.status === 'fulfilled' && ratingsRes.value) {
    const reviews = ratingsRes.value.reviews || [];
    reviewEl.innerHTML = reviews.length
      ? reviews.map(r => `<div style="padding:10px 0;border-bottom:1px solid #f0f0f0">
          <div>${'⭐'.repeat(Math.max(0, Math.min(5, Number(r.rating) || 0)))} <b>${JD.esc(r.customerName || 'Customer')}</b>
            <span class="tile-meta"> · ${JD.date(r.createdAt)}</span></div>
          <div style="margin-top:4px">${JD.esc(r.comment)}</div></div>`).join('')
      : JD.empty('💬', 'No written reviews yet.');
  } else {
    JD.fail(ratingsRes.reason, reviewEl);
  }
});
</script>
</body>
</html>
