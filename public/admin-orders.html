<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF, viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - JUohannes Logistics</title>
  <link rel="stylesheet" href="/css/menu.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

<main class="main-content">
  <h1 class="page-title">Order Management 📦</h1>
  <p class="page-sub">Every order on the platform — assign couriers and track progress.</p>
  <div class="toolbar">
    <input type="search" id="search" class="grow" placeholder="Search customer, address, shop or order #…">
    <select id="status"><option value="">All statuses</option><option value="pending">Pending</option><option value="assigned">Assigned</option><option value="picked_up">Picked up</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option><option value="failed">Failed</option></select>
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
</main>

<script src="/js/config.js"></script>
<script src="/js/menu.js"></script>
<script src="/js/page.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!JD.guard('admin')) return;
  const $ = (id) => document.getElementById(id);
  let orders = [], drivers = [];
  if (JD.param('status')) $('status').value = JD.param('status');

  const shop = (o) => {
    if (o.orderType === 'parcel') return '📦 Parcel Service';
    return (o.lineItems && o.lineItems[0] && o.lineItems[0].merchantEmail) || o.pickup || '';
  };
  const items = (o) => {
    if (o.orderType === 'parcel') return `📦 ${JD.esc(o.parcelDetails || 'Package')}`;
    return o.lineItems && o.lineItems.length ? o.lineItems.map(l => `${l.quantity}× ${JD.esc(l.name)}`).join(', ') : JD.esc(o.item || '');
  };

  function draw() {
    const q = $('search').value.trim().toLowerCase();
    const st = $('status').value;
    const rows = orders.filter(o => (!st || o.status === st) &&
      [o.customerName, o.customerEmail, o.dropoff, shop(o), String(o._id)].some(v => (v || '').toLowerCase().includes(q)));
    if (!rows.length) { $('list').innerHTML = JD.empty('📦', 'No orders match.'); return; }
    $('list').innerHTML = rows.map(o => {
      const total = (o.amount || 0) + (o.deliveryFee || 0) + (o.tip || 0);
      const canAssign = ['pending', 'assigned'].includes(o.status);
      return `<div class="order-card" data-id="${o._id}">
        <div class="order-head">
          <div><div class="order-title">${JD.esc(o.customerName || 'Customer')} <span class="tile-meta">${JD.esc(o.customerEmail || '')}</span></div>
            <div class="order-meta">${JD.date(o.createdAt, true)} · #${JD.esc(String(o._id).slice(-6))}</div></div>
          <div style="text-align:right"><div class="order-price">${JD.money(total)}</div>${JD.badge(o.status)}</div>
        </div>
        <div class="order-body">
          <div>🏪 ${JD.esc(shop(o))}</div>
          <div>🛒 ${items(o)}</div>
          <div>📍 ${JD.esc(o.dropoff)}</div>
          <div>💳 ${JD.esc(o.paymentMethod || 'Cash')}</div>
          <div>🚗 ${o.assignedDriver ? JD.esc(o.assignedDriver) : 'No courier assigned'}</div>
        </div>
        <div class="btn-row" style="align-items:center">
          ${canAssign ? `<select data-driver style="width:auto;min-width:200px"><option value="">Choose courier…</option>${drivers.map(d => `<option ${d === o.assignedDriver ? 'selected' : ''}>${JD.esc(d)}</option>`).join('')}</select>
            <button class="btn btn-sm" data-assign>${o.assignedDriver ? 'Reassign' : 'Assign'}</button>` : ''}
          ${o.status === 'assigned' ? '<button class="btn btn-sm btn-secondary" data-status="pending">Unassign</button>' : ''}
          ${['pending', 'assigned', 'picked_up'].includes(o.status) ? '<button class="btn btn-sm btn-danger" data-status="cancelled">Cancel order</button>' : ''}
        </div>
      </div>`;
    }).join('');
  }

  async function load() {
    try {
      [orders, drivers] = await Promise.all([JD.api('/api/orders'), JD.api('/api/admin/drivers').catch(() => [])]);
      draw();
    } catch (e) { JD.fail(e, $('list')); }
  }

  $('list').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-assign],[data-status]');
    if (!btn) return;
    const card = btn.closest('[data-id]');
    const id = card.dataset.id;
    try {
      if (btn.hasAttribute('data-assign')) {
        const driverEmail = card.querySelector('[data-driver]').value;
        if (!driverEmail) return JD.toast('Choose a driver first');
        await JD.api(`/api/orders/${id}/assign`, { method: 'PATCH', body: { driverEmail } });
        JD.toast('Courier assigned');
      } else {
        const status = btn.dataset.status;
        await JD.api(`/api/orders/${id}/status`, { method: 'PATCH', body: { status } });
        JD.toast('Order updated');
      }
      await load();
    } catch (err) { JD.toast(err.message); }
  });

  $('search').addEventListener('input', draw);
  $('status').addEventListener('change', draw);
  load();
});
</script>
</body>
</html>
