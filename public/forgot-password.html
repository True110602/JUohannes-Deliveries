<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Johannes Deliveries</title>
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>

<div class="fx-shell fx-center">
<div style="width:100%; max-width:400px;">

  <div class="fx-brand">
    <img src="/assets/icon.svg" alt="Johannes Deliveries" class="fx-logo-mark">
    <div class="fx-brand-text"><b>Johannes</b> Deliveries</div>
  </div>

  <div class="fx-card">
    <div class="fx-eyebrow fx-center-text">Account recovery</div>
    <h2 class="fx-center-text" style="margin-top:0;">Reset password</h2>

    <!-- Step 1: Request Code -->
    <div id="step1">
      <label>Email / Username</label>
      <input type="text" id="email" placeholder="Enter Email / Username">
      <button onclick="requestCode(this)" style="margin-top:16px;">Get Reset Code</button>
    </div>

    <!-- Step 2: Input Code & New Password -->
    <div id="step2" class="hidden" style="display:none;">
      <label>Reset Code</label>
      <input type="text" id="resetCode" placeholder="6-Digit Reset Code">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="Enter New Password">
      <button onclick="resetPassword(this)" style="margin-top:16px;">Update Password</button>
    </div>

    <p id="message" class="fx-status"></p>
    <p class="fx-center-text fx-muted" style="margin-top:6px;"><a href="/login.html" class="fx-link">Back to login</a></p>
  </div>
</div>
</div>

<script src="/js/ui-helpers.js"></script>
<script>
  async function requestCode(btn) {
    const email = document.getElementById('email').value;
    setButtonLoading(btn, true, 'Sending...');
    const res = await fetch('/api/request-password-reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    setButtonLoading(btn, false);
    document.getElementById('message').innerText = data.message;
    document.getElementById('message').style.color = data.success ? '#4ade80' : '#ff5d7a';

    if (data.success) {
      if (data.devResetCode) console.log("Dev Reset Code:", data.devResetCode);
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
    }
  }

  async function resetPassword(btn) {
    const email = document.getElementById('email').value;
    const resetCode = document.getElementById('resetCode').value;
    const newPassword = document.getElementById('newPassword').value;

    setButtonLoading(btn, true, 'Updating...');
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, resetCode, newPassword })
    });
    const data = await res.json();
    setButtonLoading(btn, false);
    document.getElementById('message').innerText = data.message;
    document.getElementById('message').style.color = data.success ? '#4ade80' : '#ff5d7a';

    if (data.success) {
      setTimeout(() => { window.location.href = '/index.html'; }, 2000);
    }
  }
</script>

</body>
</html>
