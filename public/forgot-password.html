<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - Johannes Deliveries</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f4f9; }
    .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #007bff; color: white; font-weight: bold; cursor: pointer; border: none; }
    .hidden { display: none; }
    #message { margin-top: 15px; font-size: 0.9em; text-align: center; }
  </style>
</head>
<body>

<div class="card">
  <h2>Reset Password</h2>
  
  <!-- Step 1: Request Code -->
  <div id="step1">
    <input type="text" id="email" placeholder="Enter Email / Username">
    <button onclick="requestCode()">Get Reset Code</button>
  </div>

  <!-- Step 2: Input Code & New Password -->
  <div id="step2" class="hidden">
    <input type="text" id="resetCode" placeholder="6-Digit Reset Code">
    <input type="password" id="newPassword" placeholder="Enter New Password">
    <button onclick="resetPassword()">Update Password</button>
  </div>

  <div id="message"></div>
</div>

<script>
  async function requestCode() {
    const email = document.getElementById('email').value;
    const res = await fetch('/api/request-password-reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    document.getElementById('message').innerText = data.message;
    
    if (data.success) {
      if (data.devResetCode) console.log("Dev Reset Code:", data.devResetCode);
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
    }
  }

  async function resetPassword() {
    const email = document.getElementById('email').value;
    const resetCode = document.getElementById('resetCode').value;
    const newPassword = document.getElementById('newPassword').value;

    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, resetCode, newPassword })
    });
    const data = await res.json();
    document.getElementById('message').innerText = data.message;

    if (data.success) {
      setTimeout(() => { window.location.href = '/index.html'; }, 2000);
    }
  }
</script>

</body>
</html>
