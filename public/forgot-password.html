<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - JUohannes Deliveries</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 100%;
      padding: 40px;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo {
      font-size: 48px;
      margin-bottom: 15px;
    }
    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #999;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 20px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .message { font-size: 14px; margin-top: 8px; padding: 10px; border-radius: 4px; display: none; }
    .error { color: #f44336; background: #ffebee; }
    .success { color: #4CAF50; background: #e8f5e9; }
    .back-link { text-align: center; margin-top: 20px; }
    .back-link a { color: #667eea; text-decoration: none; font-size: 14px; font-weight: 600; }
    .back-link a:hover { text-decoration: underline; }
    .loading { display: none; text-align: center; margin-top: 10px; }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-right: 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .step { display: none; }
    .step.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🔑</div>
      <h1>Reset Password</h1>
      <p class="subtitle">Recover your account access</p>
    </div>

    <!-- Step 1: Request Code -->
    <div class="step active" id="step1">
      <form id="requestCodeForm">
        <div class="form-group">
          <label for="email">Enter your email address *</label>
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>
        <div id="msg1" class="message"></div>
        <button type="submit" class="btn" id="submitBtn1">Send Reset Code</button>
        <div class="loading" id="loading1">
          <span class="spinner"></span> Sending code...
        </div>
      </form>
    </div>

    <!-- Step 2: Reset Password -->
    <div class="step" id="step2">
      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="resetCode">Verification Code *</label>
          <input type="text" id="resetCode" placeholder="Enter 6-digit code" required>
        </div>
        <div class="form-group">
          <label for="newPassword">New Password *</label>
          <input type="password" id="newPassword" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div id="msg2" class="message"></div>
        <button type="submit" class="btn" id="submitBtn2">Reset Password</button>
        <div class="loading" id="loading2">
          <span class="spinner"></span> Resetting...
        </div>
      </form>
    </div>

    <div class="back-link">
      <a href="login.html">Back to Login</a>
    </div>
  </div>

  <script>
    const API_BASE_URL = window.location.origin;
    let userEmail = '';

    // Step 1: Request Code
    document.getElementById('requestCodeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      userEmail = document.getElementById('email').value.trim();
      const msg = document.getElementById('msg1');
      const loading = document.getElementById('loading1');
      const btn = document.getElementById('submitBtn1');

      msg.style.display = 'none';
      loading.style.display = 'block';
      btn.disabled = true;

      try {
        const response = await fetch(`${API_BASE_URL}/api/request-password-reset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail })
        });

        const data = await response.json();

        if (data.success) {
          msg.textContent = '✅ ' + data.message;
          msg.className = 'message success';
          msg.style.display = 'block';
          
          setTimeout(() => {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
          }, 1500);
        } else {
          msg.textContent = '❌ ' + (data.message || 'Failed to send code');
          msg.className = 'message error';
          msg.style.display = 'block';
          btn.disabled = false;
        }
      } catch (err) {
        msg.textContent = '❌ Error: ' + err.message;
        msg.className = 'message error';
        msg.style.display = 'block';
        btn.disabled = false;
      } finally {
        loading.style.display = 'none';
      }
    });

    // Step 2: Reset Password
    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const msg = document.getElementById('msg2');
      const loading = document.getElementById('loading2');
      const btn = document.getElementById('submitBtn2');

      msg.style.display = 'none';
      loading.style.display = 'block';
      btn.disabled = true;

      try {
        const response = await fetch(`${API_BASE_URL}/api/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: userEmail,
            resetCode: document.getElementById('resetCode').value.trim(),
            newPassword: document.getElementById('newPassword').value
          })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          msg.textContent = '✅ Password reset successfully! Redirecting...';
          msg.className = 'message success';
          msg.style.display = 'block';
          
          setTimeout(() => {
            window.location.href = data.redirectUrl || '/customer.html';
          }, 2000);
        } else {
          msg.textContent = '❌ ' + (data.message || 'Failed to reset password');
          msg.className = 'message error';
          msg.style.display = 'block';
          btn.disabled = false;
        }
      } catch (err) {
        msg.textContent = '❌ Error: ' + err.message;
        msg.className = 'message error';
        msg.style.display = 'block';
        btn.disabled = false;
      } finally {
        loading.style.display = 'none';
      }
    });
  </script>
</body>
</html>
