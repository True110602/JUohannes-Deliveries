<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Johannes Deliveries</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; margin-bottom: 15px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .error { color: red; font-size: 14px; text-align: center; margin-bottom: 10px; }
    .hint { font-size: 12px; color: #666; background: #f8f9fa; padding: 8px; border-radius: 4px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Portal Login</h2>
    <div class="hint">
      <b>Logins:</b><br>
      • customer / 1234<br>
      • driver / 1234<br>
      • merchant / 1234<br>
      • admin / 1234
    </div>

    <div id="errorMsg" class="error"></div>
    
    <form id="loginForm">
      <label>Username:</label>
      <input type="text" id="username" required placeholder="e.g. driver">

      <label>Password:</label>
      <input type="password" id="password" required placeholder="1234">

      <button type="submit">Login</button>
    </form>
  </div>

  <script src="/js/config.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMsg');
      errorDiv.innerText = '';

      try {
        // These demo logins (customer/driver/merchant/admin) double as the
        // portal selector - server.js uses "app" to build the redirect URL,
        // so we send the username as both "app" and "email".
        const res = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include', // required so the session cookie actually gets stored
          body: JSON.stringify({ app: username, email: username, password })
        });

        const data = await res.json();
        if (data.success) {
          window.location.href = data.redirectUrl;
        } else {
          errorDiv.innerText = data.message || 'Login failed';
        }
      } catch (err) {
        errorDiv.innerText = 'Server connection error.';
      }
    });
  </script>

</body>
</html>
