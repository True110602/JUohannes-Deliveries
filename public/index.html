<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Johannes Deliveries</title>
  <link rel="icon" type="image/png" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #007bff, #0056b3);
      font-family: Arial, sans-serif;
    }
    .splash {
      text-align: center;
      animation: fadeIn 0.5s ease-in;
    }
    .splash img {
      width: 160px;
      height: 160px;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.25));
    }
    .splash h1 {
      color: #fff;
      font-size: 26px;
      margin: 16px 0 4px;
    }
    .splash p {
      color: #d7e9ff;
      font-size: 14px;
      margin: 0 0 20px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      margin: 0 auto;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div class="splash">
    <img src="/assets/icon.svg" alt="Johannes Deliveries">
    <h1>Johannes Deliveries</h1>
    <p>Fast, reliable delivery</p>
    <div class="spinner"></div>
  </div>
  <script>
    // Brief branded pause before moving on to login - also gives a
    // Render free-tier cold start a moment to finish waking up instead
    // of the user staring at a blank white page.
    setTimeout(() => {
      window.location.href = '/login.html';
    }, 1200);
  </script>
</body>
</html>
