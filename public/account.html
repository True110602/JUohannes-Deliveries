<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings - JUohannes Logistics Hub</title>
  <link rel="stylesheet" href="/css/menu.css">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; }
    .page-title { font-size: 28px; font-weight: 700; margin: 0 0 25px 0; color: #333; }
    .card { background: white; border-radius: 8px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    .card-title { font-size: 16px; font-weight: 700; color: #333; margin-bottom: 20px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 8px; }
    .form-input { width: 100%; padding: 12px 15px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px; }
    .form-input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .btn { display: inline-block; padding: 10px 18px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 13px; font-weight: 600; margin-right: 10px; margin-top: 15px; }
    .btn:hover { background: #764ba2; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .btn-danger { background: #e74c3c; }
    .toggle-switch { display: inline-block; position: relative; width: 50px; height: 26px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: 0.4s; border-radius: 26px; }
    .toggle-slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: 0.4s; border-radius: 50%; }
    input:checked + .toggle-slider { background-color: #667eea; }
    input:checked + .toggle-slider:before { transform: translateX(24px); }
  </style>
</head>
