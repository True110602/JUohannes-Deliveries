<!DOCTYPE html>
<html lang="en">
<head>
<script src="/js/config.js"></script>
<script src="/js/ui-helpers.js"></script>
<script>
  (async function verifyAuth() {
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/index.html';
      return;
    }
    try {
      const res = await fetch((window.API_BASE || '') + '/api/check-session', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (!res.ok || !data.loggedIn) {
        localStorage.removeItem('token');
        window.location.href = '/index.html';
      } else if (data.user.role !== 'admin') {
        window.location.href = data.redirectUrl || '/customer.html';
      }
    } catch (err) {
      console.error('Session validation error:', err);
    }
  })();

  function logoutAdmin() {
    clearAuthToken();
    window.location.href = '/login.html';
  }
</script>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Johannes Deliveries - Admin Dashboard</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>

  <div class="fx-shell" style="max-width: 1200px;">
    <div class="fx-nav">
      <div class="fx-nav-title">
        <img src="/assets/icon.svg" alt="Johannes Deliveries" class="fx-logo-mark">
        <div>
          <span class="fx-pill">Admin</span>
          <h2 style="margin:6px 0 0;">Fleet & orders dashboard</h2>
        </div>
      </div>
      <button class="fx-btn-ghost" style="width:auto;" onclick="window.location.href='/account.html'">My Account</button>
      <button class="fx-btn-danger" style="width:auto;" onclick="logoutAdmin()">Logout</button>
    </div>

    <div class="dashboard-grid">

      <div class="section fx-card">
        <div class="fx-eyebrow">Live tracking</div>
        <h3 style="margin-top:0;">Driver fleet</h3>
        <div id="map"></div>
        <p class="fx-muted" id="fleetCount" style="margin-top:10px;">Waiting for driver positions...</p>
      </div>

      <div class="section fx-card">
        <div class="fx-eyebrow">Operations</div>
        <h3 style="margin-top:0;">Orders</h3>
        <div class="fx-table-wrap">
          <table>
            <thead>
              <tr>
                <th>Customer</th>
                <th>Item</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Driver</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr><td colspan="6" class="fx-muted">Loading orders...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="section fx-card" style="flex-basis: 100%;">
        <div class="fx-eyebrow">Moderation</div>
        <h3 style="margin-top:0;">Merchant approvals</h3>
        <p class="fx-muted" style="margin-top:0;">New merchants can't list items publicly until approved here.</p>
        <div id="merchantApprovalsList"><span class="inline-spinner fx-spinner-light"></span>Loading merchants...</div>
      </div>

    </div>
  </div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-20.1350, 28.5800], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const driverMarkers = {};

    function upsertDriverMarker(d) {
      if (driverMarkers[d.driverId]) {
        driverMarkers[d.driverId].setLatLng([d.lat, d.lng]);
      } else {
        driverMarkers[d.driverId] = L.marker([d.lat, d.lng]).addTo(map)
          .bindPopup(`<b>${d.driverId}</b>`);
      }
    }

    const socket = io(window.API_BASE || undefined, {
      auth: { token: getAuthToken() }
    });

    socket.on('update_fleet', (drivers) => {
      document.getElementById('fleetCount').innerText =
        drivers.length ? `${drivers.length} driver(s) currently tracked.` : 'No drivers are currently broadcasting location.';
      drivers.forEach(upsertDriverMarker);
    });

    socket.on('update_orders', (orders) => renderOrders(orders));

    // ---- Orders ----
    let driverListCache = null;

    function statusBadge(status) {
      return `<span class="status-badge status-${status}">${status.replace('_',' ')}</span>`;
    }

    async function assignDriver(orderId, selectEl) {
      const driverEmail = selectEl.value;
      if (!driverEmail) return;
      selectEl.disabled = true;
      try {
        const res = await authFetch(`${window.API_BASE}/api/orders/${orderId}/assign`, {
          method: 'PATCH',
          body: JSON.stringify({ driverEmail })
        });
        const data = await res.json();
        if (!data.success) {
          showToast(data.message || 'Could not assign driver.', 'error');
          selectEl.disabled = false;
        }
      } catch (err) {
        showToast('Server error assigning driver.', 'error');
        selectEl.disabled = false;
      }
    }

    async function updateStatus(orderId, status) {
      try {
        const res = await authFetch(`${window.API_BASE}/api/orders/${orderId}/status`, {
          method: 'PATCH',
          body: JSON.stringify({ status })
        });
        const data = await res.json();
        if (!data.success) showToast(data.message || 'Could not update status.', 'error');
      } catch (err) {
        showToast('Server error updating status.', 'error');
      }
    }

    function driverResponseBadge(o) {
      if (!o.assignedDriver) return '';
      if (o.driverAccepted === true) return '<div class="fx-muted" style="font-size:11px; color:#4ade80;">Accepted</div>';
      if (o.driverAccepted === false) return '<div class="fx-muted" style="font-size:11px; color:#ff5d7a;">Declined</div>';
      return '<div class="fx-muted" style="font-size:11px; color:#f59e0b;">Awaiting response</div>';
    }

    function renderOrders(orders) {
      const tbody = document.getElementById('ordersTableBody');
      if (!orders.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="fx-muted">No orders yet.</td></tr>';
        return;
      }

      tbody.innerHTML = orders.map(o => `
        <tr>
          <td>${o.customerName}<div class="fx-muted" style="font-size:11.5px;">${o.pickup} &rarr; ${o.dropoff}</div></td>
          <td>${o.item || '<i>-</i>'}</td>
          <td>$${(o.amount || 0).toFixed(2)}</td>
          <td>${statusBadge(o.status)}</td>
          <td>${o.assignedDriver || '<i>Unassigned</i>'}${driverResponseBadge(o)}</td>
          <td>
            <select onchange="assignDriver('${o._id}', this)" style="width:auto; padding:4px 6px; margin:0; font-size:12px;">
              <option value="">Assign driver...</option>
              ${(driverListCache || []).map(d => `<option value="${d}" ${o.assignedDriver === d ? 'selected' : ''}>${d}</option>`).join('')}
            </select>
            <select onchange="updateStatus('${o._id}', this.value)" style="width:auto; padding:4px 6px; margin:4px 0 0; font-size:12px;">
              <option value="">Set status...</option>
              ${['pending','assigned','picked_up','delivered','cancelled','failed'].map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s.replace('_',' ')}</option>`).join('')}
            </select>
          </td>
        </tr>
      `).join('');
    }

    // Previously this list was built only from orders that already had a
    // driver assigned - meaning there was no way to assign a driver for
    // the very first time (empty dropdown, nothing to pick). It now comes
    // from the actual registered drivers.
    async function loadDrivers() {
      try {
        const res = await authFetch(`${window.API_BASE}/api/admin/drivers`);
        driverListCache = await res.json();
      } catch (err) {
        console.error('Could not load driver list', err);
        driverListCache = [];
      }
    }

    async function loadOrders() {
      try {
        const res = await authFetch(`${window.API_BASE}/api/orders`);
        const orders = await res.json();
        renderOrders(orders);
      } catch (err) {
        document.getElementById('ordersTableBody').innerHTML = '<tr><td colspan="6" class="fx-muted">Could not load orders.</td></tr>';
      }
    }

    async function loadMerchantApprovals() {
      const list = document.getElementById('merchantApprovalsList');
      try {
        const res = await authFetch(`${window.API_BASE}/api/admin/merchants`);
        const merchants = await res.json();

        if (!merchants.length) {
          list.innerHTML = '<i class="fx-muted">No merchants registered yet.</i>';
          return;
        }

        list.innerHTML = merchants.map(m => `
          <div class="fx-card" style="margin-top:8px; display:flex; justify-content:space-between; align-items:center;">
            <div>
              <b>${m.shopName || m.email}</b>
              <div class="fx-muted" style="font-size:12px;">${m.email}</div>
            </div>
            ${m.approved
              ? '<span class="fx-pill" style="background:rgba(74,222,128,0.15); color:#4ade80;">Approved</span>'
              : `<button style="width:auto;" onclick="approveMerchant('${m._id}', this)">Approve</button>`
            }
          </div>
        `).join('');
      } catch (err) {
        list.innerHTML = '<i class="fx-muted">Could not load merchants.</i>';
      }
    }

    async function approveMerchant(id, btn) {
      setButtonLoading(btn, true, 'Approving...');
      try {
        await authFetch(`${window.API_BASE}/api/admin/merchants/${id}/approve`, { method: 'PATCH' });
        loadMerchantApprovals();
      } catch (err) {
        setButtonLoading(btn, false);
        alert('Could not approve merchant.');
      }
    }

    loadDrivers().then(loadOrders);
    loadMerchantApprovals();
  </script>
</body>
</html>
