<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - JUohannes Deliveries</title>
  <link rel="stylesheet" href="/css/theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .register-container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 450px; padding: 40px; }
    .register-header { text-align: center; margin-bottom: 30px; }
    .register-logo { font-size: 48px; margin-bottom: 10px; }
    .register-title { font-size: 28px; font-weight: 700; color: #333; margin-bottom: 5px; }
    .register-subtitle { font-size: 14px; color: #999; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 8px; }
    .form-input, .form-select { width: 100%; padding: 12px 15px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px; transition: all 0.2s; }
    .form-input:focus, .form-select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .form-button:hover { background: #764ba2; }
    .form-footer { text-align: center; margin-top: 20px; font-size: 13px; color: #666; }
    .form-footer a { color: #667eea; text-decoration: none; font-weight: 600; }
    .error-message { color: #e74c3c; font-size: 13px; margin-top: 5px; }
    .success-message { color: #27ae60; font-size: 13px; margin-top: 5px; }
  </style>
</head>
<body>

<div class="register-container">
  
  <div class="register-header">
    <div class="register-logo">📦</div>
    <h1 class="register-title">Join JUohannes</h1>
    <p class="register-subtitle">Create your account</p>
  </div>

  <form id="registerForm">
    
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">First Name</label>
        <input type="text" id="firstName" class="form-input" placeholder="John" required>
      </div>
      <div class="form-group">
        <label class="form-label">Last Name</label>
        <input type="text" id="lastName" class="form-input" placeholder="Doe" required>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
    </div>

    <div class="form-group">
      <label class="form-label">Phone Number</label>
      <input type="tel" id="phone" class="form-input" placeholder="+263 712 345 678" required>
    </div>

    <div class="form-group">
      <label class="form-label">I am a...</label>
      <select id="role" class="form-select" required>
        <option value="">-- Select your role --</option>
        <option value="customer">Customer (Food Delivery)</option>
        <option value="merchant">Merchant (Restaurant)</option>
        <option value="driver">Driver (Delivery Partner)</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      <small style="color: #999; display: block; margin-top: 5px;">Min 6 characters</small>
    </div>

    <div class="form-group">
      <label class="form-label">Confirm Password</label>
      <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required>
    </div>

    <button type="submit" class="form-button">Create Account</button>

    <div id="registerError" class="error-message" style="text-align: center; margin-top: 15px;"></div>
    <div id="registerSuccess" class="success-message" style="text-align: center; margin-top: 15px;"></div>

  </form>

  <div class="form-footer">
    <p>Already have an account? <a href="login.html">Sign in</a></p>
  </div>

</div>

<script src="/js/config.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const firstName = document.getElementById('firstName').value;
    const lastName = document.getElementById('lastName').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    const role = document.getElementById('role').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorDiv = document.getElementById('registerError');
    const successDiv = document.getElementById('registerSuccess');

    errorDiv.textContent = '';
    successDiv.textContent = '';

    // Validate
    if (password !== confirmPassword) {
      errorDiv.textContent = 'Passwords do not match';
      return;
    }

    if (password.length < 6) {
      errorDiv.textContent = 'Password must be at least 6 characters';
      return;
    }

    try {
      const response = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          firstName,
          lastName,
          email,
          phone,
          role,
          password
        })
      });

      const data = await response.json();

      if (data.success) {
        successDiv.textContent = 'Account created! Redirecting to login...';
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } else {
        errorDiv.textContent = data.message || 'Registration failed. Please try again.';
      }
    } catch (err) {
      errorDiv.textContent = 'Connection error. Please try again.';
      console.error('Register error:', err);
    }
  });
</script>

</body>
</html>
