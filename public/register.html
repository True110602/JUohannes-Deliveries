<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Johannes Deliveries</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .register-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 340px; margin: 20px 0; }
    input, select, button { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px; box-sizing: border-box; }
    button { background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:disabled { background: #6c757d; cursor: not-allowed; }
    .error { color: red; font-size: 14px; text-align: center; margin-bottom: 10px; }
    .success { color: green; font-size: 14px; text-align: center; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="register-box">
    <h2>Create Account</h2>
    <div id="msg" class="error"></div>

    <form id="registerForm">
      <label>Account Type:</label>
      <select name="role" required>
        <option value="customer">Customer</option>
        <option value="driver">Driver</option>
        <option value="merchant">Merchant / Restaurant</option>
        <option value="admin">Admin</option>
      </select>

      <label>Email Address / Username:</label>
      <input type="text" name="email" required placeholder="e.g. driver or name@example.com">

      <label>Password:</label>
      <input type="password" name="password" required placeholder="••••••••">

      <label>Physical Address:</label>
      <input type="text" name="address" required placeholder="e.g. Bulawayo CBD">

      <label>Preferred Payment Method:</label>
      <select name="paymentMethod" required>
        <option value="Cash">Cash on Delivery</option>
        <option value="EcoCash">EcoCash</option>
        <option value="Card">Card</option>
      </select>

      <button type="submit" id="submitBtn">Create Account</button>
    </form>
    <p style="text-align: center; margin-top: 15px;">Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script src="/js/config.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = new FormData(e.target);
      const payload = Object.fromEntries(formData.entries());
      const msgDiv = document.getElementById('msg');
      const submitBtn = document.getElementById('submitBtn');

      msgDiv.className = 'error';
      msgDiv.innerText = '';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Creating Account...';

      try {
        const baseUrl = window.API_BASE || '';
        const res = await fetch(`${baseUrl}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok && data.success) {
          msgDiv.className = 'success';
          msgDiv.innerText = 'Registration successful! Redirecting to login...';
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        } else {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Create Account';
          msgDiv.innerText = data.message || 'Registration failed. Please try again.';
        }
      } catch (err) {
        console.error('Registration error:', err);
        submitBtn.disabled = false;
        submitBtn.innerText = 'Create Account';
        msgDiv.innerText = 'Server connection error. Please check Render backend status.';
      }
    });
  </script>
</body>
</html>
