<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/config.js"></script>
  <script src="/js/ui-helpers.js"></script>
  <script>
    authFetch(`${window.API_BASE}/api/check-session`)
      .then(res => res.json())
      .then(data => {
        if (!data.loggedIn) {
          window.location.href = '/login.html';
        }
      });
  </script>
  <meta charset="UTF-8">
  <title>Johannes Deliveries - Merchant Portal</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
    .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 4px rgba(0,0,0,0.1); margin: auto; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; margin-bottom: 15px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .item-list { margin-top: 20px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #ddd; }
    .btn-toggle { width: auto; padding: 5px 10px; margin: 0; font-size: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Merchant Catalog Manager</h2>
    
    <form id="addItemForm">
      <label>Item Name:</label>
      <input type="text" id="itemName" required placeholder="e.g. Mozambican Piri-Piri Chicken">
      
      <label>Price (USD):</label>
      <input type="number" id="itemPrice" step="0.01" required placeholder="12.50">

      <button type="submit">Add Item to Catalog</button>
    </form>

    <h3>Current Catalog</h3>
    <div id="catalogContainer" class="item-list">
      <span class="inline-spinner"></span> Loading items...
    </div>
  </div>

  <script>
    async function fetchCatalog() {
      try {
        const res = await authFetch(`${window.API_BASE}/api/catalog`);
        const items = await res.json();
        const container = document.getElementById('catalogContainer');
        container.innerHTML = '';

        if (items.length === 0) {
          container.innerHTML = '<i>No catalog items found. Add your first item above!</i>';
          return;
        }

        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'item-row';
          div.innerHTML = `
            <div>
              <strong>${item.name}</strong> - $${item.price.toFixed(2)} 
              <span style="color: ${item.inStock ? 'green' : 'red'}">(${item.inStock ? 'In Stock' : 'Out of Stock'})</span>
            </div>
            <button class="btn-toggle" onclick="toggleStock('${item._id}', this)">
              ${item.inStock ? 'Mark Out of Stock' : 'Mark In Stock'}
            </button>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        document.getElementById('catalogContainer').innerHTML = 'Error loading catalog.';
      }
    }

    document.getElementById('addItemForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('itemName').value;
      const price = document.getElementById('itemPrice').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');

      setButtonLoading(submitBtn, true, 'Adding Item...');

      try {
        const res = await authFetch(`${window.API_BASE}/api/catalog`, {
          method: 'POST',
          body: JSON.stringify({ name, price })
        });

        if (res.ok) {
          document.getElementById('itemName').value = '';
          document.getElementById('itemPrice').value = '';
          fetchCatalog();
        } else {
          alert('Failed to add item');
        }
      } catch (err) {
        alert('Server connection error');
      } finally {
        setButtonLoading(submitBtn, false);
      }
    });

    async function toggleStock(id, button) {
      setButtonLoading(button, true, 'Updating...');
      try {
        const res = await authFetch(`${window.API_BASE}/api/catalog/${id}/stock`, {
          method: 'PATCH'
        });
        if (res.ok) {
          fetchCatalog();
        } else {
          alert('Failed to update stock status');
        }
      } catch (err) {
        alert('Server error updating stock');
      } finally {
        setButtonLoading(button, false);
      }
    }

    fetchCatalog();
  </script>

</body>
</html>
