<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JUohannes Deliveries</title>
  <link rel="stylesheet" href="/css/theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-container { background: white; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 400px; padding: 40px; }
    .login-header { text-align: center; margin-bottom: 30px; }
    .login-logo { font-size: 48px; margin-bottom: 10px; }
    .login-title { font-size: 28px; font-weight: 700; color: #333; margin-bottom: 5px; }
    .login-subtitle { font-size: 14px; color: #999; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 8px; }
    .form-input { width: 100%; padding: 12px 15px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px; transition: all 0.2s; }
    .form-input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
    .form-button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .form-button:hover { background: #764ba2; transform: translateY(-1px); }
    .form-footer { text-align: center; margin-top: 20px; font-size: 13px; color: #666; }
    .form-footer a { color: #667eea; text-decoration: none; font-weight: 600; }
    .form-footer a:hover { text-decoration: underline; }
    .error-message { color: #e74c3c; font-size: 13px; margin-top: 5px; }
    .success-message { color: #27ae60; font-size: 13px; margin-top: 5px; }
  </style>
</head>
<body>

<div class="login-container">
  
  <div class="login-header">
    <div class="login-logo">📦</div>
    <h1 class="login-title">JUohannes</h1>
    <p class="login-subtitle">Fast Delivery Service</p>
  </div>

  <form id="loginForm">
    
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
      <div class="error-message" id="emailError"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      <div class="error-message" id="passwordError"></div>
    </div>

    <button type="submit" class="form-button">Sign In</button>

    <div id="loginError" class="error-message" style="text-align: center; margin-top: 15px;"></div>
    <div id="loginSuccess" class="success-message" style="text-align: center; margin-top: 15px;"></div>

  </form>

  <div class="form-footer">
    <p>Don't have an account? <a href="register.html">Create one</a></p>
    <p style="margin-top: 10px;"><a href="forgot-password.html">Forgot password?</a></p>
  </div>

</div>

<script src="/js/config.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('loginError');
    const successDiv = document.getElementById('loginSuccess');

    errorDiv.textContent = '';
    successDiv.textContent = '';

    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (data.success) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('userEmail', email);
        successDiv.textContent = 'Login successful! Redirecting...';
        
        setTimeout(() => {
          // Check role and redirect
          fetch('/api/check-session', {
            headers: { 'Authorization': `Bearer ${data.token}` }
          })
          .then(r => r.json())
          .then(d => {
            if (d.redirectUrl) {
              window.location.href = d.redirectUrl;
            }
          });
        }, 1000);
      } else {
        errorDiv.textContent = data.message || 'Login failed. Please try again.';
      }
    } catch (err) {
      errorDiv.textContent = 'Connection error. Please try again.';
      console.error('Login error:', err);
    }
  });
</script>

</body>
</html>
