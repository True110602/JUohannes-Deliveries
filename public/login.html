<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JUohannes Deliveries</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 100%;
      padding: 40px;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo {
      font-size: 48px;
      margin-bottom: 15px;
    }
    h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #999;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 20px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .error {
      color: #f44336;
      font-size: 14px;
      margin-top: 8px;
      padding: 10px;
      background: #ffebee;
      border-radius: 4px;
      display: none;
    }
    .links {
      text-align: center;
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .links a {
      color: #667eea;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .loading { display: none; text-align: center; margin-top: 10px; }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-right: 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">📦</div>
      <h1>Login</h1>
      <p class="subtitle">Welcome back to JUohannes Deliveries</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email or Username *</label>
        <input type="text" id="email" placeholder="your@email.com or username" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password *</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <div id="errorMsg" class="error"></div>

      <button type="submit" class="btn" id="submitBtn">Login</button>

      <div class="loading" id="loading">
        <span class="spinner"></span> Logging in...
      </div>

      <div class="links">
        <a href="forgot-password.html">Forgot Password?</a>
        <a href="register.html">Create Account</a>
      </div>
    </form>
  </div>

  <script>
    const API_BASE_URL = window.location.origin;
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loading = document.getElementById('loading');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      errorMsg.style.display = 'none';
      loading.style.display = 'block';
      submitBtn.disabled = true;

      try {
        const response = await fetch(`${API_BASE_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          window.location.href = data.redirectUrl || '/customer.html';
        } else {
          errorMsg.textContent = '❌ ' + (data.message || 'Login failed');
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
        }
      } catch (err) {
        console.error('Login error:', err);
        errorMsg.textContent = '❌ Connection error: ' + err.message;
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
      } finally {
        loading.style.display = 'none';
      }
    });
  </script>
</body>
</html>
