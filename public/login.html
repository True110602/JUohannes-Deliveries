<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Johannes Deliveries</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; margin-bottom: 15px; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:disabled { background: #6c757d; cursor: not-allowed; }
    .error { color: red; font-size: 14px; text-align: center; margin-bottom: 10px; }
    .hint { font-size: 12px; color: #666; background: #f8f9fa; padding: 8px; border-radius: 4px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Portal Login</h2>
    <div class="hint">
      <b>Demo logins:</b><br>
      • customer / 1234<br>
      • driver / 1234<br>
      • merchant / 1234<br>
      • admin / 1234
    </div>
    <div id="errorMsg" class="error"></div>

    <form id="loginForm">
      <label>Username / Email:</label>
      <input type="text" id="username" required placeholder="e.g. driver">
      <label>Password:</label>
      <input type="password" id="password" required placeholder="1234">
      <button type="submit" id="submitBtn">Login</button>
    </form>
    <p style="text-align: center; margin-top: 15px;">Don't have an account? <a href="register.html">Register here</a></p>
  </div>

  <script src="/js/config.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');

      errorDiv.innerText = '';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Logging in...';

      try {
        const baseUrl = window.API_BASE || '';
        const res = await fetch(`${baseUrl}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: username, password })
        });

        const data = await res.json();

        if (res.ok && data.success && data.token) {
          if (typeof setAuthToken === 'function') {
            setAuthToken(data.token);
          } else {
            localStorage.setItem('jwt_token', data.token);
          }
          window.location.href = data.redirectUrl || '/customer.html';
        } else {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Login';
          errorDiv.innerText = data.message || 'Login failed. Please check your credentials.';
        }
      } catch (err) {
        console.error('Login error:', err);
        submitBtn.disabled = false;
        submitBtn.innerText = 'Login';
        errorDiv.innerText = 'Server connection error. Please check your network or Render backend status.';
      }
    });
  </script>
</body>
</html>
