<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adverts - Mr L</title>
  <link rel="stylesheet" href="/css/menu.css">
  <link rel="stylesheet" href="/css/pages.css">
  <style>
    .ad-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .ad-card { border: 1px solid #eee; border-radius: 10px; overflow: hidden; background: #fff; }
    .ad-card img { width: 100%; height: 150px; object-fit: cover; display: block; background: #e8e8ee; }
    .ad-card .ad-body { padding: 12px; }
    .ad-preview { width: 100%; max-width: 420px; height: 170px; border-radius: 10px; background: #e8e8ee center/cover no-repeat; margin-top: 10px; display: none; }
    .ad-field { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; margin: 4px 0 12px; box-sizing: border-box; }
  </style>
</head>
<body>

<main class="main-content">
  <h1 class="page-title">Adverts 📣</h1>
  <p class="page-sub" id="sub">Pictures shown in the slideshow on the home page.</p>

  <div class="card">
    <h2>Add an advert</h2>
    <label class="tile-meta" for="adTitle">Headline (optional)</label>
    <input id="adTitle" class="ad-field" maxlength="80" placeholder="e.g. 20% off all pizzas this weekend">
    <label class="tile-meta" for="adFile">Picture</label>
    <input type="file" id="adFile" accept="image/jpeg,image/png,image/webp,image/gif" style="display:block;margin:4px 0">
    <div class="tile-meta">A wide picture works best (for example 1200 × 500). JPG, PNG, WEBP or GIF, up to 3 MB.</div>
    <div id="preview" class="ad-preview"></div>
    <div style="margin-top:14px"><button class="btn" id="upload">📤 Upload advert</button></div>
    <div id="limitNote" class="tile-meta" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <h2>Your adverts</h2>
    <div id="list"><div class="empty">Loading…</div></div>
  </div>
</main>

<script src="/js/config.js"></script>
<script src="/js/menu.js"></script>
<script src="/js/page.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const me = JD.guard('merchant', 'admin');
  if (!me) return;
  const $ = (id) => document.getElementById(id);
  const isAdmin = me.role === 'admin';
  let max = null;

  if (isAdmin) $('sub').textContent = 'Pictures shown in the home page slideshow. As admin you can add platform adverts and remove any advert.';

  $('adFile').addEventListener('change', () => {
    const file = $('adFile').files[0];
    const box = $('preview');
    if (!file) { box.style.display = 'none'; return; }
    box.style.backgroundImage = `url('${URL.createObjectURL(file)}')`;
    box.style.display = 'block';
  });

  async function load() {
    try {
      const r = await JD.api('/api/adverts/mine');
      max = r.max;
      const ads = r.adverts || [];
      $('limitNote').textContent = max ? `${ads.length} of ${max} adverts used.` : '';
      $('list').innerHTML = ads.length
        ? '<div class="ad-grid">' + ads.map(a => `
            <div class="ad-card">
              <img src="${JD.esc(JD.asset(a.imageUrl))}" alt="">
              <div class="ad-body">
                <div><b>${JD.esc(a.title || 'No headline')}</b></div>
                <div class="tile-meta">${isAdmin ? JD.esc(a.shopName) + ' · ' : ''}${JD.date(a.createdAt)}</div>
                <button class="btn btn-sm btn-danger" data-del="${JD.esc(a._id)}" style="margin-top:8px">🗑 Delete</button>
              </div>
            </div>`).join('') + '</div>'
        : JD.empty('📣', 'No adverts yet. Add your first one above.');
    } catch (e) { JD.fail(e, $('list')); }
  }

  $('upload').addEventListener('click', async () => {
    const file = $('adFile').files[0];
    if (!file) return JD.toast('Please choose a picture first');
    if (file.size > 25 * 1024 * 1024) return JD.toast('That image is too large');
    $('upload').disabled = true;
    $('upload').textContent = 'Uploading…';
    try {
      const fd = new FormData(); fd.append('image', await JD.compressImage(file));
      const up = await JD.api('/api/media', { method: 'POST', form: fd });
      await JD.api('/api/adverts', { method: 'POST', body: { title: $('adTitle').value.trim(), imageUrl: up.url } });
      $('adTitle').value = ''; $('adFile').value = ''; $('preview').style.display = 'none';
      JD.toast('Advert added — it now shows on the home page');
      await load();
    } catch (e) { JD.toast(e.message); }
    $('upload').disabled = false;
    $('upload').textContent = '📤 Upload advert';
  });

  $('list').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-del]');
    if (!b) return;
    if (!confirm('Delete this advert?')) return;
    try { await JD.api('/api/adverts/' + encodeURIComponent(b.dataset.del), { method: 'DELETE' }); JD.toast('Advert deleted'); await load(); }
    catch (err) { JD.toast(err.message); }
  });

  load();
});
</script>
</body>
</html>
