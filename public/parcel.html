<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send a Parcel - JUohannes Deliveries</title>
  <link rel="stylesheet" href="/css/menu.css">
  <link rel="stylesheet" href="/css/pages.css">
  <style>
    .parcel-container { max-width: 700px; margin: 0 auto; padding: 20px; }
    .parcel-section { background: white; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .section-header h2 { font-size: 20px; color: #333; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: #666; margin-bottom: 5px; }
    .form-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .price-estimate { background: #eef2ff; padding: 20px; border-radius: 8px; text-align: center; margin-top: 20px; }
    .estimate-value { font-size: 24px; font-weight: bold; color: #667eea; }
    .parcel-footer { text-align: center; margin-top: 30px; }
  </style>
</head>
<body>

<main class="main-content">
  <div class="parcel-container">
    <h1 class="page-title">📦 Send a Parcel</h1>
    <p class="page-sub">Enter the pick-up and drop-off details. A driver will be assigned to your request.</p>

    <!-- STEP 1: PICKUP -->
    <div class="parcel-section">
      <div class="section-header">
        <span>📍</span>
        <h2>Pick-up Details</h2>
      </div>
      <div class="form-group">
        <label class="form-label">Exact Pick-up Address</label>
        <input type="text" id="pickupAddr" class="form-input" placeholder="House number, Street, Suburb">
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Contact Person</label>
          <input type="text" id="pickupName" class="form-input" placeholder="Full Name">
        </div>
        <div class="form-group">
          <label class="form-label">Contact Phone</label>
          <input type="tel" id="pickupPhone" class="form-input" placeholder="+263...">
        </div>
      </div>
    </div>

    <!-- STEP 2: DROP-OFF -->
    <div class="parcel-section">
      <div class="section-header">
        <span>🏁</span>
        <h2>Drop-off Details</h2>
      </div>
      <div class="form-group">
        <label class="form-label">Exact Drop-off Address</label>
        <input type="text" id="dropoffAddr" class="form-input" placeholder="House number, Street, Suburb">
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Receiver Name</label>
          <input type="text" id="dropoffName" class="form-input" placeholder="Full Name">
        </div>
        <div class="form-group">
          <label class="form-label">Receiver Phone</label>
          <input type="tel" id="dropoffPhone" class="form-input" placeholder="+263...">
        </div>
      </div>
    </div>

    <!-- STEP 3: PARCEL INFO -->
    <div class="parcel-section">
      <div class="section-header">
        <span>📦</span>
        <h2>Parcel Information</h2>
      </div>
      <div class="form-group">
        <label class="form-label">What are we delivering?</label>
        <input type="text" id="parcelDesc" class="form-input" placeholder="e.g., A blue envelope with documents, Small box of tools">
      </div>
      <div class="form-group">
        <label class="form-label">Parcel Size</label>
        <select id="parcelSize" class="form-input" onchange="updateEstimate()">
          <option value="small">Small (Fits in a handbag) - $2.00</option>
          <option value="medium">Medium (Shoebox size) - $4.00</option>
          <option value="large">Large (Heavy/Bulky) - $7.00</option>
        </select>
      </div>

      <div class="price-estimate">
        <div class="form-label">Estimated Delivery Fee</div>
        <div class="estimate-value" id="estFee">$2.00</div>
        <div class="form-label" style="margin-top:5px">Final price may vary based on distance.</div>
      </div>
    </div>

    <div class="parcel-footer">
      <button class="btn btn-primary" id="placeParcelBtn" style="width: 100%; padding: 15px; font-size: 18px;">Request Driver Now →</button>
      <a href="/" class="btn btn-secondary" style="display:block; margin-top:15px; text-align:center">Cancel and go back</a>
    </div>
  </div>
</main>

<script src="/js/config.js"></script>
<script src="/js/menu.js"></script>
<script src="/js/page.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (!JD.guard('customer')) return;

    function updateEstimate() {
      const size = document.getElementById('parcelSize').value;
      const fees = { small: '$2.00', medium: '$4.00', large: '$7.00' };
      document.getElementById('estFee').textContent = fees[size];
    }

    document.getElementById('placeParcelBtn').onclick = async () => {
      const payload = {
        orderType: 'parcel',
        pickupAddress: document.getElementById('pickupAddr').value,
        pickupContact: document.getElementById('pickupName').value + ' (' + document.getElementById('pickupPhone').value + ')',
        dropoffAddress: document.getElementById('dropoffAddr').value,
        dropoffContact: document.getElementById('dropoffName').value + ' (' + document.getElementById('dropoffPhone').value + ')',
        parcelDetails: document.getElementById('parcelDesc').value,
        size: document.getElementById('parcelSize').value,
        amount: 0 // Parcels are usually paid to driver or fixed fee
      };

      if (!payload.pickupAddress || !payload.dropoffAddress || !payload.parcelDetails) {
        return JD.toast('Please fill in all required delivery details');
      }

      try {
        document.getElementById('placeParcelBtn').disabled = true;
        document.getElementById('placeParcelBtn').textContent = 'Requesting...';
        
        await JD.api('/api/orders/parcel', { 
          method: 'POST', 
          body: payload 
        });
        
        JD.toast('Parcel request sent! A driver will be assigned shortly.');
        window.location.href = '/orders.html';
      } catch (e) {
        JD.toast(e.message);
        document.getElementById('placeParcelBtn').disabled = false;
        document.getElementById('placeParcelBtn').textContent = 'Request Driver Now →';
      }
    };
  });
</script>
</body>
</html>
